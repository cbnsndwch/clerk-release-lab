name: Check community demo
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Format check (oxfmt)
        run: pnpm format:check
      - name: Lint (oxlint)
        run: pnpm lint
      - name: Typecheck (strict TypeScript)
        run: pnpm typecheck
      - name: Build and test
        run: pnpm test
      - name: Privacy audit
        run: pnpm privacy
